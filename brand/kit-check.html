<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bagdit kit check</title>
<style>
body{font-family:system-ui;background:#F4F7FC;padding:30px;display:grid;gap:18px}

h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#5B6B85;margin:0 0 14px}

<section><h2>Lockup (light)</h2><div class="row"><img src="bagdit-lockup.svg" height="64"><img src="bagdit-lockup.svg" height="28"></div></section>
<section class="dark"><h2>Lockup (dark)</h2><div class="row"><img src="bagdit-lockup-white.svg" height="64"><img src="bagdit-lockup-white.svg" height="28"></div></section>
<section><h2>Mark + app icon + favicons</h2><div class="row">
<img src="bagdit-mark.svg" width="72"><img src="bagdit-app-icon.svg" width="72"><img src="apple-touch-icon.png" width="60"><img src="favicon.svg" width="32"><img src="favicon-32.png" width="32"><img src="favicon.svg" width="16"><img src="favicon-16.png" width="16"></div></section>
